name: Deploy to AWS (Terraform + Ansible)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Fetch repository code
      uses: actions/checkout@v4

    - name: Configure AWS access
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-1

    - name: Configure SSH for Ansible
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh

    - name: Generate public SSH key from private key
      id: sshpub
      run: |
        ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub 2>/dev/null || true
        if [ ! -f ~/.ssh/id_ed25519.pub ]; then
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519 -q
        fi
        PUBLIC_KEY=$(tr -d '\n' < ~/.ssh/id_ed25519.pub)
        printf 'ssh_public_key=%s\n' "$PUBLIC_KEY" >> "$GITHUB_OUTPUT"

    - name: Install and configure Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      env:
        TF_VAR_ssh_public_key: ${{ steps.sshpub.outputs.ssh_public_key }}
      run: |
        cd terraform
        terraform init

    - name: Terraform Plan
      env:
        TF_VAR_ssh_public_key: ${{ steps.sshpub.outputs.ssh_public_key }}
      run: |
        cd terraform
        terraform plan

    - name: Terraform Apply
      env:
        TF_VAR_ssh_public_key: ${{ steps.sshpub.outputs.ssh_public_key }}
      run: |
        cd terraform
        terraform apply -auto-approve -json | tee terraform-apply.json

    - name: Save generated SSH private key for later steps
      run: |
        cd terraform
        terraform output -raw private_key_openssh > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519

    - name: Add EC2 host key to known hosts
      run: |
        cd terraform
        HOST_IP=$(terraform output -raw ec2_public_ip)
        mkdir -p ~/.ssh
        ssh-keyscan -H "$HOST_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

    - name: Install Ansible and Docker collection
      run: |
        sudo apt-get update
        sudo apt-get install -y ansible python3-pip
        ansible-galaxy collection install community.docker

    - name: Debug SSH key and EC2 connection
      run: |
        cd terraform
        HOST_IP=$(terraform output -raw ec2_public_ip)
        echo "Host IP: $HOST_IP"
        ls -l ~/.ssh/id_ed25519
        ssh-keygen -y -f ~/.ssh/id_ed25519 > /tmp/public_key.pub
        echo "Public key preview:" && cat /tmp/public_key.pub
        echo "Trying SSH to ubuntu..."
        ssh -vvv -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 ubuntu@$HOST_IP 'echo ok' || true

    - name: Run the Ansible Playbook
      run: |
        cd ansible
        export ANSIBLE_HOST_KEY_CHECKING=False
        export ANSIBLE_SSH_ARGS='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes -o ConnectTimeout=10'
        ansible-playbook -vvv -i inventory.ini playbook.yml
