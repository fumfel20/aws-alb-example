name: Deploy to AWS (Terraform + Ansible)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Fetch repository code
      uses: actions/checkout@v4

    - name: Configure AWS access
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-1

    - name: Configure SSH for Ansible
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519

    - name: Install and configure Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      env:
        TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      run: |
        cd terraform
        terraform init

    - name: Terraform Plan
      env:
        TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      run: |
        cd terraform
        terraform plan

    - name: Terraform Apply
      env:
        TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      run: |
        cd terraform
        terraform apply -auto-approve

    - name: Add EC2 host key to known hosts
      run: |
        cd terraform
        HOST_IP=$(terraform output -raw ec2_public_ip)
        mkdir -p ~/.ssh
        ssh-keyscan -H "$HOST_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

    - name: Install Ansible and Docker collection
      run: |
        sudo apt-get update
        sudo apt-get install -y ansible python3-pip
        ansible-galaxy collection install community.docker

    - name: Run the Ansible Playbook
      run: |
        cd ansible
        export ANSIBLE_HOST_KEY_CHECKING=False
        ansible-playbook -i inventory.ini playbook.yml
