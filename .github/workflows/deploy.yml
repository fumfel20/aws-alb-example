name: Deploy to AWS (Terraform + Ansible)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Fetch repository code
      uses: actions/checkout@v4

    - name: Configure AWS access
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-1

    - name: Configure SSH for Ansible
      run: |
        mkdir -p ~/.ssh
        printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519

    - name: Generate public SSH key from private key
      id: sshpub
      run: |
        ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
        PUBLIC_KEY=$(tr -d '\n' < ~/.ssh/id_ed25519.pub)
        printf 'ssh_public_key=%s\n' "$PUBLIC_KEY" >> "$GITHUB_OUTPUT"

    - name: Install and configure Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      env:
        TF_VAR_ssh_public_key: ${{ steps.sshpub.outputs.ssh_public_key }}
      run: |
        cd terraform
        terraform init

    - name: Terraform Plan
      env:
        TF_VAR_ssh_public_key: ${{ steps.sshpub.outputs.ssh_public_key }}
      run: |
        cd terraform
        terraform plan

    - name: Terraform Apply
      env:
        TF_VAR_ssh_public_key: ${{ steps.sshpub.outputs.ssh_public_key }}
      run: |
        cd terraform
        terraform apply -auto-approve

    - name: Add EC2 host key to known hosts
      run: |
        cd terraform
        HOST_IP=$(terraform output -raw ec2_public_ip)
        mkdir -p ~/.ssh
        ssh-keyscan -H "$HOST_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

    - name: Install Ansible and Docker collection
      run: |
        sudo apt-get update
        sudo apt-get install -y ansible python3-pip
        ansible-galaxy collection install community.docker

    - name: Wait for EC2 SSH to become available
      run: |
        cd terraform
        HOST_IP=$(terraform output -raw ec2_public_ip)
        DETECTED_USER=""
        for USER in ubuntu ec2-user admin; do
          if ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i ~/.ssh/id_ed25519 "$USER@$HOST_IP" "echo ready" 2>/dev/null; then
            DETECTED_USER="$USER"
            break
          fi
        done
        if [ -z "$DETECTED_USER" ]; then
          echo "No working SSH user was found for $HOST_IP" >&2
          exit 1
        fi
        echo "SSH_USER=$DETECTED_USER" >> "$GITHUB_ENV"
        echo "Detected SSH user: $DETECTED_USER"

    - name: Run the Ansible Playbook
      run: |
        cd ansible
        export ANSIBLE_HOST_KEY_CHECKING=False
        export ANSIBLE_SSH_ARGS='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes'
        ansible-playbook -i inventory.ini -e "ansible_user=${SSH_USER} ansible_ssh_private_key_file=/home/runner/.ssh/id_ed25519" playbook.yml
