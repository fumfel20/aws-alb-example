name: Deploy to AWS (Terraform + Ansible)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Fetch repository code
      uses: actions/checkout@v4

    - name: Configure AWS access
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-1

    - name: Configure SSH for Ansible
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh

    - name: Generate public SSH key from private key
      id: sshpub
      run: |
        ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub 2>/dev/null || true
        if [ ! -f ~/.ssh/id_ed25519.pub ]; then
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519 -q
        fi
        PUBLIC_KEY=$(tr -d '\n' < ~/.ssh/id_ed25519.pub)
        printf 'ssh_public_key=%s\n' "$PUBLIC_KEY" >> "$GITHUB_OUTPUT"

    - name: Install and configure Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      env:
        TF_VAR_ssh_public_key: ${{ steps.sshpub.outputs.ssh_public_key }}
      run: |
        cd terraform
        terraform init

    - name: Terraform Plan
      env:
        TF_VAR_ssh_public_key: ${{ steps.sshpub.outputs.ssh_public_key }}
      run: |
        cd terraform
        terraform plan

    - name: Terraform Apply
      env:
        TF_VAR_ssh_public_key: ${{ steps.sshpub.outputs.ssh_public_key }}
      run: |
        cd terraform
        terraform apply -auto-approve -json | tee terraform-apply.json

    - name: Save generated SSH private key for later steps
      run: |
        cd terraform
        terraform output -raw private_key_openssh > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519

    - name: Add EC2 host key to known hosts
      run: |
        cd terraform
        HOST_IP=$(terraform output -raw ec2_public_ip)
        mkdir -p ~/.ssh
        ssh-keyscan -H "$HOST_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

    - name: Wait for instance and Docker initialization
      run: |
        cd terraform
        HOST_IP=$(terraform output -raw ec2_public_ip)
        echo "Waiting for instance SSH and Docker to be ready on $HOST_IP..."
        for i in {1..24}; do
          if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i ~/.ssh/id_ed25519 ubuntu@$HOST_IP "test -d /opt/app && docker ps >/dev/null 2>&1"; then
            echo "Instance and Docker are ready!"
            exit 0
          fi
          echo "Waiting... ($((i*5))s)"
          sleep 5
        done
        echo "Timeout waiting for instance to initialize."
        exit 1

    - name: Copy application files to EC2
      run: |
        cd terraform
        HOST_IP=$(terraform output -raw ec2_public_ip)
        scp -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 -r ../app/* ubuntu@$HOST_IP:/opt/app/

    - name: Build and run containers on EC2
      run: |
        cd terraform
        HOST_IP=$(terraform output -raw ec2_public_ip)
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 ubuntu@$HOST_IP "
          cd /opt/app
          docker build -t my-app:latest .
          docker stop app-container-1 app-container-2 2>/dev/null || true
          docker rm app-container-1 app-container-2 2>/dev/null || true
          docker run -d --name app-container-1 -p 8080:80 --restart always my-app:latest
          docker run -d --name app-container-2 -p 8081:80 --restart always my-app:latest
        "

