---

- name: Configure EC2 and run the application in Docker
  hosts: webservers
  become: true
  gather_facts: true

  tasks:
    - name: Update apt cache and install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - docker.io
          - python3-pip
        update_cache: yes
        state: present

    - name: Ensure Docker is running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Install Python Docker SDK for Ansible Docker modules
      pip:
        name: docker

    - name: Create a directory for the application
      file:
        path: /opt/app
        state: directory
        mode: '0755'

    - name: Copy application files (Dockerfile and index.html)
      copy:
        src: ../app/
        dest: /opt/app/
        owner: root
        group: root
        mode: '0644'

    - name: Build the Docker image locally on the instance
      community.docker.docker_image:
        path: /opt/app
        name: my-app
        state: present

    - name: Ensure app-container-1 is running on port 8080
      community.docker.docker_container:
        name: app-container-1
        image: my-app:latest
        state: started
        restart_policy: always
        published_ports:
          - "8080:80"

    - name: Ensure app-container-2 is running on port 8081
      community.docker.docker_container:
        name: app-container-2
        image: my-app:latest
        state: started
        restart_policy: always
        published_ports:
          - "8081:80"
